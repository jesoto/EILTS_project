[project]
name = "ielts-trainer"
version = "0.1.0"
description = "Entrenador local de IELTS Academic (Streamlit + Ollama)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
