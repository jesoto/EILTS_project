[project]
name = "ielts-trainer"
version = "0.1.0"
description = "Entrenador local de IELTS Academic (Streamlit + Ollama)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "tzdata>=2024.1",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "av>=14,<17",   # av 19 rompe faster-whisper (metadata_errors)
]

[project.optional-dependencies]
# Whisper local (modo "local"); en Streamlit Cloud se usa la API de OpenAI y no se instala.
local-stt = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
